{% extends 'base.html' %}
{% block titulo %}Eliminar inmueble{% endblock %}
{% block contenido %}
<div class="card mx-auto shadow-sm border-danger" style="max-width: 520px;">
    <div class="card-body">
        <h2 class="h4 text-danger">Eliminar inmueble</h2>
        <p>¿Seguro que quieres eliminar <strong>{{ inmueble.nombre }}</strong>
           ({{ inmueble.comuna.nombre }})? Esta acción no se puede deshacer.</p>
        <!-- El borrado se hace con POST: un simple enlace (GET) nunca debe borrar datos -->
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'mis_inmuebles' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
