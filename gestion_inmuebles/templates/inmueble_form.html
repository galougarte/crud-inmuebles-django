{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="card mx-auto shadow-sm" style="max-width: 640px;">
    <div class="card-body">
        <h2 class="h4 mb-3">{{ titulo }}</h2>
     
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'mis_inmuebles' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
